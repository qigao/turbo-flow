version: 1

profiles:
  flowie:
    endpoint: mqtt.endpoint
    rule_set: mqtt.routing
    auth_provider: mqtt.auth-service

channels:
  mqtt.auth-service:
    kind: auth_provider
    config:
      backend: https
      url: https://auth.internal.example/v4/authenticate
      method: password
      service_id: broker-main
      service_domain: platform-services
      service_token_ref: env://FLOWIE_TEST_AUTH_SERVICE_TOKEN
      timeout_ms: 3000
      max_secret_size: 4096
  mqtt.security:
    kind: security_realm
    config:
      resource_uid: security:mqtt
      owner_name: security.main
      policy_source: mqtt.acl-service
  mqtt.acl-service:
    kind: acl_provider
    config:
      backend: https
      url: https://auth.internal.example/v4/acl/check
      service_id: broker-main
      service_domain: platform-services
      service_token_ref: env://FLOWIE_TEST_AUTH_SERVICE_TOKEN
      timeout_ms: 3000
      max_response_size: 65536
  mqtt.routing:
    kind: rule_set
    config:
      resource_uid: rule-set:mqtt.routing
      owner_name: flowie.routing
      mode: first_match
      rules:
        - when: mqtt.topic == "application/output"
          action: route
          key: application_data_sink
        - when: "true"
          action: route
          key: mqtt_delivery_sink

adapters:
  mqtt.endpoint:
    kind: flowie_endpoint
    config:
      transport: tcp
      host: 127.0.0.1
      port: 1883
      max_packet_size: 4096
      coroutine_stack_size: 65536
      stream_recv_buffer_bytes: 4096
      send_hwm_bytes: 4096
      slow_subscriber_policy: disconnect
      manage_sessions: true
      settlement_qos1: accepted
      settlement_qos2: accepted
      max_sessions: 16
      max_retained_messages: 16
      max_subscriptions_per_session: 8
      max_inflight_per_session: 8
      security_realm: mqtt.security
      auth_method: password
  socket.application.output:
    kind: socket
    config:
      role: sink
      transport: tcp
      host: 127.0.0.1
      port: 1884
      timeout_ms: 1000
      send_hwm_bytes: 4096
