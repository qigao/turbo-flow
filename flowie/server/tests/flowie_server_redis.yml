version: 1

profiles:
  flowie:
    endpoint: mqtt.endpoint
    rule_set: mqtt.routing

channels:
  mqtt.sessions:
    kind: record_store
    config:
      backend: redis
      host: 127.0.0.1
      port: 6379
      database: 15
      timeout_ms: 5000
      key: flowie-server-check-sessions-v1
      max_key_size: 65538
      max_value_size: 65536
      max_batch_size: 16
      max_records: 32
  mqtt.routing:
    kind: rule_set
    config:
      resource_uid: rule-set:mqtt.routing
      owner_name: flowie.routing
      mode: first_match
      rules:
        - when: mqtt.topic == "application/output"
          action: route
          key: application_data_sink
        - when: "true"
          action: route
          key: mqtt_delivery_sink

adapters:
  mqtt.endpoint:
    kind: flowie_endpoint
    config:
      transport: tcp
      host: 127.0.0.1
      port: 1883
      max_packet_size: 4096
      coroutine_stack_size: 65536
      stream_recv_buffer_bytes: 4096
      send_hwm_bytes: 4096
      slow_subscriber_policy: disconnect
      manage_sessions: true
      settlement_qos1: accepted
      settlement_qos2: accepted
      max_sessions: 16
      max_retained_messages: 16
      max_subscriptions_per_session: 8
      max_inflight_per_session: 8
      session_store: mqtt.sessions
  socket.application.output:
    kind: socket
    config:
      role: sink
      transport: tcp
      host: 127.0.0.1
      port: 1884
      timeout_ms: 1000
      send_hwm_bytes: 4096
