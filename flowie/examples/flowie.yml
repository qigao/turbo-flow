# Flowie endpoint, owner-lane subscription fan-out, and memory Queue ACCEPTED composition.
version: 1

# Process-level handoff for timer and I/O producers. Capacity exhaustion fails
# immediately; these workers submit into the same Flow sources as direct calls.
runtime:
  ingress:
    workers: 1
    capacity: 1024

profiles:
  flowie:
    endpoint: mqtt.endpoint
    accept_sink: queue.mqtt.accept
    accepted_source: queue.mqtt.accepted
    rule_set: mqtt.routing
    output: socket.application.output

channels:
  mqtt.accepted:
    kind: queue
    config:
      backend: memory
      pattern: push_pull
      resource_uid: queue:mqtt.accepted
      owner_name: mqtt-accepted
      capacity: 1024
      max_payload_size: 1048576
      full_policy: fail
  mqtt.routing:
    kind: rule_set
    config:
      resource_uid: rule-set:mqtt.routing
      owner_name: flowie.routing
      mode: first_match
      max_instructions: 4096
      max_time_ns: 10000000
      max_memory_bytes: 1048576
      max_output_actions: 16
      max_output_bytes: 16384
      rules:
        - when: mqtt.topic == "application/output"
          action: route
          key: application_output
        - when: "true"
          action: route
          key: mqtt_fanout

# Durable managed sessions and retained publications use one record-store channel with distinct
# versioned keys. `max_records` must cover max_sessions + max_retained_messages, and
# max_key_size must cover the 3-byte retained prefix plus a maximum MQTT Topic Name.
# `flowie_server` creates the selected SQLite or Redis provider from this YAML and injects it through
# flowie_endpoint_bindings_t. Uncomment both this channel and session_store below to enable it.
# A custom host may provide the same binding through flowie_register_resolved_bound_endpoint[_ex].
#  mqtt.sessions:
#    kind: record_store
#    config:
#      backend: sqlite
#      database_path: flowie.sqlite3
#      namespace_name: mqtt.sessions
#      busy_timeout_ms: 1000
#      max_key_size: 65538
#      max_value_size: 16777216
#      max_batch_size: 4096
#      max_records: 200000

# A secure deployment may add a SecurityRealm channel here. Credentials are
# never stored in YAML: the host injects a typed authentication provider and
# the realm handle through flowie_endpoint_security_binding_t, then calls
# flowie_register_resolved_secure_endpoint[_ex]. Example policy shape:
#  security.main:
#    kind: security_realm
#    config:
#      resource_uid: security:mqtt
#      owner_name: security.main
#      policy_version: 1
#      rules:
#        - effect: allow
#          subject_kind: role
#          subject: mqtt-writer
#          tenant_id: tenant-a
#          actions: [connect]
#          resource_type: generic
#          match: prefix
#          pattern: client-
#        - effect: allow
#          subject_kind: role
#          subject: mqtt-writer
#          tenant_id: tenant-a
#          actions: [publish, subscribe]
#          resource_type: mqtt_topic
#          match: adapter
#          pattern: tenant-a/#

adapters:
  mqtt.endpoint:
    kind: flowie_endpoint
    config:
      transport: tcp
      host: 0.0.0.0
      port: 1883
      max_packet_size: 1048576
      max_connections: 100000
      # Applies only to the private CoroNet context. 32768 is the supported minimum;
      # borrowed/owned contexts must be sized by their host and must omit this field.
      coroutine_stack_size: 65536
      # Capacity of each of CoroNet's two receive chunks per connection. MQTT framing
      # reassembles across chunks; borrowed/owned contexts must omit this field.
      recv_buffer_size: 4096
      send_hwm_bytes: 1048576
      # A connection that exhausts this bounded send budget is isolated; fan-out continues.
      slow_subscriber_policy: disconnect
      manage_sessions: true
      # Omit both fields, or use received, for the legacy receive-boundary ACK contract.
      # accepted requires the bounded memory Queue below; processed waits for graph completion;
      # durable requires a SQLite COMMIT or Redis XADD settlement. There is no fallback.
      # Quiesce and drain the endpoint before changing these fields and the graph together.
      settlement_qos1: accepted
      settlement_qos2: accepted
      max_sessions: 100000
      max_retained_messages: 100000
      max_subscriptions_per_session: 1024
      max_inflight_per_session: 64
#      session_store: mqtt.sessions
# A secure endpoint additionally requires both fields and the matching typed
# host binding; normal resolved registration rejects them instead of silently
# running without authentication:
#      security_realm: security.main
#      auth_method: password
  queue.mqtt.accept:
    kind: queue
    config:
      channel: mqtt.accepted
      role: sink
  queue.mqtt.accepted:
    kind: queue
    config:
      channel: mqtt.accepted
      role: source
  socket.application.output:
    kind: socket
    config:
      role: sink
      transport: tcp
      host: 127.0.0.1
      port: 1884
      timeout_ms: 5000
      send_hwm_bytes: 1048576
# The managed endpoint consumes MQTT control packets and publishes only admitted
# owned PUBLISH packets. ACCEPTED is the memory Queue commit, and its source
# republishes the owned packet into the application path. A second explicit use
# of the same bidirectional endpoint adapter performs subscription fan-out; the
# socket ingress never hides that application routing decision. The graph remains
# TurboFlow DSL until a typed YAML graph projection exists:
# source mqtt_packet_in adapter mqtt.endpoint
# stage mqtt_accept adapter queue.mqtt.accept
# source mqtt_accepted adapter queue.mqtt.accepted
# stage rules_route operation rules.apply resource mqtt.routing
# stage mqtt_fanout adapter mqtt.endpoint
# stage application_output adapter socket.application.output
# stage main {
#   mqtt_packet_in -> mqtt_accept
#   mqtt_accepted -> rules_route -> [mqtt_fanout, application_output]
# }
# For durable message settlement, set settlement_qos1/qos2 to durable and
# replace mqtt.accept with a SQLite Queue sink or Redis Stream sink. The
# persistent message primitive stores the owned packet without its live route. Durable session
# restore is an independent `session_store` record-store binding; both may be enabled together.
# Rollback requires quiescing/draining again, restoring received (or omitting both fields), and
# restoring the matching graph in the same stopped deployment; settlement fields are not hot-reloaded.
