# Default configured Flowie broker.
#
# This YAML creates deployment instances and sets resource bounds. The companion
# flowie.flow is the only source of truth for data sources, processors, data
# sinks, branches, and their execution order.
version: 1

# Process-level handoff used by timer and I/O producers. Capacity exhaustion
# fails immediately; workers publish into the same Graph sources as direct calls.
runtime:
  ingress:
    workers: 1
    capacity: 1024

# Composition-root bindings required to construct the MQTT protocol owner and
# optional RuleSet binding. The RuleSet binding is required only when the Graph
# references rules.apply. These names do not define Graph
# topology or select a business data sink.
profiles:
  flowie:
    endpoint: mqtt.endpoint
    rule_set: mqtt.routing
    # A secure profile also selects an auth-provider channel. Its backend must
    # be registered by the composition root; selection is exact with no fallback.
#   auth_provider: mqtt.auth-service

channels:
  mqtt.routing:
    kind: rule_set
    config:
      resource_uid: rule-set:mqtt.routing
      owner_name: flowie.routing
      mode: first_match
      max_instructions: 4096
      max_time_ns: 10000000
      max_memory_bytes: 1048576
      max_output_actions: 16
      max_output_bytes: 16384
      rules:
        - when: mqtt.topic == "application/output"
          action: route
          key: application_data_sink
        - when: "true"
          action: route
          key: mqtt_delivery_sink

# By default Flowie uses the volatile local Record backend from the tf_local_storage shared library.
# Durable managed sessions and retained publications use one record-store channel with distinct
# versioned keys. `max_records` must cover max_sessions + max_retained_messages, and
# max_key_size must cover the 3-byte retained prefix plus a maximum MQTT Topic Name.
# `flowie_server` registers local/Redis/PostgreSQL through the StorageBackend registry and creates the
# selected Redis or PostgreSQL provider from this YAML, then injects it through
# flowie_endpoint_bindings_t. Uncomment both this channel and session_store below to enable it.
# A custom host may provide the same binding through flowie_register_resolved_bound_endpoint[_ex].
#  mqtt.sessions:
#    kind: record_store
#    config:
#      backend: redis
#      host: 127.0.0.1
#      port: 6379
#      database: 0
#      key: flowie-mqtt-sessions-v1
#      max_key_size: 65538
#      max_value_size: 16777216
#      max_batch_size: 4096
#      max_records: 200000

# A secure deployment adds an HTTPS authentication-service channel and a local SecurityRealm.
# Flowie never receives database coordinates: Redis, SQLite, PostgreSQL, or another credential
# store remains private to the authentication service. The service-token value is resolved by the
# host key provider and is never written into YAML. ACL rule bodies are also absent from YAML:
# the realm references one exact HTTPS or embedded SQLite ACL provider.
#  mqtt.auth-service:
#    kind: auth_provider
#    config:
#      backend: https
#      url: https://auth.internal.example/v2/authenticate
#      method: password
#      service_token_ref: env://FLOWIE_AUTH_SERVICE_TOKEN
#      timeout_ms: 3000
#      max_secret_size: 4096
#      tls:
#        ca_file: C:/certs/auth-service-ca.pem
#        client_cert_file: C:/certs/flowie-client.pem
#        client_key_file: C:/certs/flowie-client-key.pem
#        client_key_password_ref: env://FLOWIE_AUTH_TLS_KEY_PASSWORD
#  mqtt.acl-service:
#    kind: acl_provider
#    config:
#      backend: https
#      url: https://auth.internal.example/v1/acl-bundle
#      service_token_ref: env://FLOWIE_AUTH_SERVICE_TOKEN
#      timeout_ms: 3000
#      max_response_size: 4194304
#      max_rules: 4096
#      tls:
#        ca_file: C:/certs/auth-service-ca.pem
#        client_cert_file: C:/certs/flowie-client.pem
#        client_key_file: C:/certs/flowie-client-key.pem
#        client_key_password_ref: env://FLOWIE_AUTH_TLS_KEY_PASSWORD
# For a single-host control plane, use an embedded SQLite provider instead:
#  mqtt.acl-local:
#    kind: acl_provider
#    config:
#      backend: sqlite
#      database_path: flowie-acl.sqlite3
#      namespace_name: mqtt
#      busy_timeout_ms: 1000
#      max_rules: 4096
#  security.main:
#    kind: security_realm
#    config:
#      resource_uid: security:mqtt
#      owner_name: security.main
#      policy_source: mqtt.acl-service

adapters:
  # Bidirectional MQTT boundary: admitted PUBLISH source and subscription
  # delivery sink. The Graph decides where each role appears.
  mqtt.endpoint:
    kind: flowie_endpoint
    config:
      transport: tcp
      host: 0.0.0.0
      port: 1883
      max_packet_size: 1048576
      max_connections: 100000
      # Applies only to the private CoroNet context. 65536 is the supported minimum;
      # borrowed/owned contexts must be sized by their host and must omit this field.
      coroutine_stack_size: 65536
      # Capacity of each of CoroNet's two receive chunks per connection. MQTT framing
      # reassembles across chunks; borrowed/owned contexts must omit this field.
      stream_recv_buffer_bytes: 4096
      send_hwm_bytes: 1048576
      # A connection that exhausts this bounded send budget is isolated; fan-out continues.
      slow_subscriber_policy: disconnect
      manage_sessions: true
      # Omit both fields, or use received, for the legacy receive-boundary ACK contract.
      # accepted and processed wait for the configured graph boundary. There is no fallback.
      # Quiesce and drain the endpoint before changing these fields and the graph together.
      settlement_qos1: accepted
      settlement_qos2: accepted
      max_sessions: 100000
      max_retained_messages: 100000
      max_subscriptions_per_session: 1024
      max_inflight_per_session: 64
      # Per-connection inbound Topic Alias table. Zero disables aliases.
      topic_alias_maximum: 256
#      session_store: mqtt.sessions
# A secure endpoint additionally requires both fields and the matching typed
# host binding; normal resolved registration rejects them instead of silently
# running without authentication:
#      security_realm: security.main
#      auth_method: password
  # Explicit application data sink selected by the Policy route above.
  socket.application.output:
    kind: socket
    config:
      role: sink
      transport: tcp
      host: 127.0.0.1
      port: 1884
      timeout_ms: 5000
      send_hwm_bytes: 1048576
# The managed endpoint consumes MQTT control packets and publishes only admitted,
# owned PUBLISH messages. flowie.flow explicitly connects that source to the
# Policy stage and then to either the MQTT delivery sink or the application data sink.
# Control packets and session
# state remain owned by the endpoint and never become implicit Graph stages.
# Durable session restore remains an independent `session_store` record-store binding.
