# Flowie dev product: the server binds a standalone SQLite `:memory:` ProtocolStore.
version: 1

runtime:
  ingress:
    workers: 1
    capacity: 1024

profiles:
  flowie:
    endpoint: mqtt.endpoint
    rule_set: mqtt.routing

channels:
  mqtt.routing:
    kind: rule_set
    config:
      resource_uid: rule-set:mqtt.routing
      owner_name: flowie.dev.routing
      mode: first_match
      max_instructions: 4096
      max_time_ns: 10000000
      max_memory_bytes: 1048576
      max_output_actions: 16
      max_output_bytes: 16384
      rules:
        - when: "true"
          action: route
          key: mqtt_delivery_sink

adapters:
  mqtt.endpoint:
    kind: flowie_endpoint
    config:
      transport: tcp
      host: 127.0.0.1
      port: 1883
      max_packet_size: 1048576
      max_connections: 128
      coroutine_stack_size: 65536
      stream_recv_buffer_bytes: 4096
      send_hwm_bytes: 1048576
      slow_subscriber_policy: disconnect
      manage_sessions: true
      settlement_qos1: accepted
      settlement_qos2: accepted
      max_sessions: 128
      max_retained_messages: 128
      max_subscriptions_per_session: 32
      max_inflight_per_session: 16
      topic_alias_maximum: 16
