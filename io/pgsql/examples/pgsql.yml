version: 1

profiles:
  orders:
    enqueue: pg.orders.sink
    dequeue: pg.orders.source

channels:
  orders.outbox:
    kind: outbox
    config:
      backend: postgresql
      conninfo: "host=127.0.0.1 port=5432 dbname=flow user=flow password=change-me"
      outbox_name: orders
      capacity: 1024
      max_payload_size: 1048576
      poll_interval_ms: 50
      claim_scan_limit: 64
      create_table: true

adapters:
  pg.orders.sink:
    kind: pgsql_outbox
    config:
      channel: orders.outbox
      role: sink
  pg.orders.source:
    kind: pgsql_outbox
    config:
      channel: orders.outbox
      role: source
