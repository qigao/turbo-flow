version: 1

profiles:
  production:
    publisher: fmq.events.pub
    subscriber: fmq.events.sub
    control_server: fmq.control.rep
    control_client: fmq.control.req
    management_server: fmq.management.rep
    management_events: fmq.management.events

fragments:
  connection:
    local-events:
      transport: tcp
      host: 127.0.0.1
      port: 7701
    local-control:
      transport: tcp
      host: 127.0.0.1
      port: 7702
    local-management:
      transport: tcp
      host: 127.0.0.1
      port: 7703
    local-management-events:
      transport: tcp
      host: 127.0.0.1
      port: 7704
  timer:
    realtime:
      timeout_ms: 5000
      heartbeat_interval_ms: 1000
      heartbeat_timeout_ms: 3000

channels:
  management-operations:
    kind: blob_store
    config:
      backend: sqlite
      database_path: flow-management.sqlite3
      key: tfmp:local-flow-management
      busy_timeout_ms: 1000
      max_value_size: 8388608

  flow-control:
    kind: fmq_control
    config:
      protocol_version: 1
      target: data-plane
      dedup_capacity: 256
      max_request_bytes: 5179

  flow-management:
    kind: fmq_management
    config:
      protocol_major: 1
      protocol_minor: 0
      authority_id: local-flow-management
      rpc_adapter: fmq.management.rep
      mailbox_capacity: 256
      max_request_bytes: 65536
      max_reply_bytes: 65536
      max_inflight_per_target: 1
      dedup_capacity: 512
      dedup_ttl_ms: 300000
      operation_store: management-operations
      event_adapter: fmq.management.events
      event_capacity: 1024
      event_replay_store: management-operations
      shutdown_timeout_ms: 5000

  request-broker:
    kind: fmq_pattern
    config:
      pattern: load_balancer
      scheduler: lru
      max_workers: 256
      max_inflight: 4096

  reliable-request-broker:
    kind: fmq_pattern
    config:
      pattern: reliable_request
      scheduler: lru
      max_workers: 256
      max_inflight: 4096
      reliability: at_least_once
      worker_lease_ms: 3000
      dedup_capacity: 4096
      dedup_ttl_ms: 300000
      max_attempts: 3

  bulk-workers:
    kind: fmq_pattern
    config:
      pattern: credit_worker
      scheduler: lru
      reliability: at_most_once
      max_workers: 256
      max_inflight: 4096
      worker_lease_ms: 15000
      max_credit_messages_per_worker: 64
      max_credit_bytes_per_worker: 67108864
      max_job_bytes: 8388608

  pubsub-state:
    kind: fmq_pattern
    config:
      pattern: pubsub_state
      max_topics: 4096
      max_state_bytes: 16777216
      update_capacity: 8192
      max_update_bytes: 33554432

adapters:
  fmq.events.pub:
    kind: fmq
    fragments:
      connection: local-events
      timer: realtime
    config:
      pattern: pub
      mode: bind
      topic: events
      frame_hwm_messages: 1024
      frame_hwm_bytes: 16777216
      frame_admission_policy: fail
      peer_hwm_messages: 128
      peer_hwm_bytes: 8388608
      slow_peer_policy: disconnect
      frame_linger_ms: 1000

  fmq.events.sub:
    kind: fmq
    fragments:
      connection: local-events
      timer: realtime
    config:
      pattern: sub
      mode: connect
      identity: example-events-sub-1
      topic: events
      reconnect_initial_ms: 500
      reconnect_max_ms: 10000

  fmq.control.rep:
    kind: fmq
    fragments:
      connection: local-control
      timer: realtime
    config:
      pattern: rep
      mode: bind
      content_type: application/vnd.turboflow.control-v1
      frame_hwm_messages: 256
      frame_hwm_bytes: 2097152

  fmq.control.req:
    kind: fmq
    fragments:
      connection: local-control
      timer: realtime
    config:
      pattern: req
      mode: connect
      content_type: application/vnd.turboflow.control-v1
      reconnect_initial_ms: 500
      reconnect_max_ms: 10000

  fmq.management.rep:
    kind: fmq
    fragments:
      connection: local-management
      timer: realtime
    config:
      pattern: rep
      mode: bind
      content_type: application/vnd.turboflow.management-v1
      frame_hwm_messages: 256
      frame_hwm_bytes: 16777216

  fmq.management.events:
    kind: fmq
    fragments:
      connection: local-management-events
      timer: realtime
    config:
      pattern: pub
      mode: bind
      topic_policy: content
      content_type: application/vnd.turboflow.management-v1
      frame_hwm_messages: 1024
      frame_hwm_bytes: 16777216
