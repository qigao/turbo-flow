name: SaltsUtils DataBind package contract

on:
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'turbo_flow/CMakeLists.txt'
      - 'turbo_flow/include/turbo_flow_databind.h'
      - 'turbo_flow/src/flow_databind_plan.c'
      - 'turbo_flow/src/flow_product_databind.c'
      - 'turbo_flow/src/flow_internal.h'
      - 'turbo_flow/src/flow_plan.c'
      - 'turbo_flow/src/flow_plan_semantics.c'
      - 'turbo_flow/tests/CMakeLists.txt'
      - 'turbo_flow/tests/test_flow_databind_channel_plan.c'
      - 'turbo_flow/tests/test_flow_databind_service_plan.c'
      - 'turbo_flow/tests/databind_service.schema'
      - 'turbo_flow/tests/databind_service_header_cpp.cpp'
      - 'turbo_flow/tests/databind_channel.schema'
      - 'turbo_flow/tests/databind_channel_projection.json'
      - 'CMakeUserPresets.json'
      - 'cmake/TurboFlowConfig.cmake.in'
      - 'ingress/protocol/CMakeLists.txt'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/workflows/task4-runtime-focused.yml'
      - '.github/workflows/protocol-network-intake.yml'
      - 'tests/install_consumer/**'
      - 'cmake/ci/restore-versioned-native-sdks.ps1'
      - '.github/workflows/rulesforge-provider.yml'
      - 'cmake/ci/restore-versioned-native-sdks.ps1'
      - '.github/workflows/rulesforge-provider.yml'
      - 'tests/cmake/run_databind_package_root_contract.cmake'
      - '.github/workflows/databind-package-root.yml'
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'turbo_flow/CMakeLists.txt'
      - 'turbo_flow/include/turbo_flow_databind.h'
      - 'turbo_flow/src/flow_databind_plan.c'
      - 'turbo_flow/src/flow_product_databind.c'
      - 'turbo_flow/src/flow_internal.h'
      - 'turbo_flow/src/flow_plan.c'
      - 'turbo_flow/src/flow_plan_semantics.c'
      - 'turbo_flow/tests/CMakeLists.txt'
      - 'turbo_flow/tests/test_flow_databind_channel_plan.c'
      - 'turbo_flow/tests/test_flow_databind_service_plan.c'
      - 'turbo_flow/tests/databind_service.schema'
      - 'turbo_flow/tests/databind_service_header_cpp.cpp'
      - 'turbo_flow/tests/databind_channel.schema'
      - 'turbo_flow/tests/databind_channel_projection.json'
      - 'CMakeUserPresets.json'
      - 'cmake/TurboFlowConfig.cmake.in'
      - 'ingress/protocol/CMakeLists.txt'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/workflows/task4-runtime-focused.yml'
      - '.github/workflows/protocol-network-intake.yml'
      - 'tests/install_consumer/**'
      - 'tests/cmake/run_databind_package_root_contract.cmake'
      - '.github/workflows/databind-package-root.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: databind-package-root-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package-root:
    name: Exact-head SaltsUtils DataBind provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run executable SaltsUtils DataBind contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -DTURBO_FLOW_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DTURBO_FLOW_TEST_ROOT="$RUNNER_TEMP/databind-package-root-contract" \
            -P tests/cmake/run_databind_package_root_contract.cmake

      - name: Verify preset JSON remains valid
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m json.tool CMakeUserPresets.json >/dev/null
          python3 -m json.tool tests/install_consumer/CMakeUserPresets.json >/dev/null
          python3 -m json.tool tests/install_consumer/component/CMakeUserPresets.json >/dev/null

      - name: Use empty vcpkg L1 cache
        shell: bash
        run: |
          set -euxo pipefail
          cache="$RUNNER_TEMP/databind-empty-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore latest published Salts SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Verify released DataBind Service SDK surface
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_UTILS_ROOT/include/data_bind_method_plan.h"
          test -f "$SALTS_UTILS_ROOT/include/data_bind_binding_plan.h"
          test -x "$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"
          test -z "${DATABIND_ROOT:-}"
          test -z "${DATABIND_HOST_ROOT:-}"

      - name: Configure generated DataBind plan tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/databind-plan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DTURBO_FLOW_BUILD_RULESFORGE_PLUGIN=OFF \
            -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=OFF \
            -DTURBO_FLOW_IDLC_HOST_EXECUTABLE="$SALTS_UTILS_HOST_ROOT/bin/salts-idlc" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching

      - name: Build and run generated Channel and Service plan tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/databind-plan \
            --target test_flow_databind_channel_plan test_flow_databind_service_plan -j2
          ctest --test-dir build/databind-plan \
            -R '^test_flow_databind_(channel|service)_plan      - name: Verify committed source remained clean
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
 \
            --output-on-failure

      - name: Verify committed source remained clean
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
