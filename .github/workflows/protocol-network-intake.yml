name: Protocol network intake

on:
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'turbo_flow/**'
      - 'io/cnet/**'
      - 'io/durable/**'
      - 'ingress/protocol/**'
      - 'plugins/applicant_mapper/**'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/ci/protocol-network-compile/**'
      - '.github/workflows/protocol-network-intake.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: protocol-network-intake-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  linux:
    name: Published protocol intake contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact TurboFlow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/protocol-intake-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          git diff --exit-code
          git rev-parse HEAD | tee "$RUNNER_TEMP/protocol-intake-evidence/head.txt"

      - name: Use empty vcpkg L1 cache
        shell: bash
        run: |
          set -euxo pipefail
          cache="$RUNNER_TEMP/protocol-intake-empty-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore latest published native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Verify published dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/include/data_bind.h"
          test -x "$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"
          test -z "${DATABIND_ROOT:-}"
          test -z "${DATABIND_HOST_ROOT:-}"

      - name: Configure public compile contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S .github/ci/protocol-network-compile             -B build/protocol-network-compile -G Ninja             -DTURBO_FLOW_SOURCE_DIR="$GITHUB_WORKSPACE"             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching             2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/configure.log"

      - name: Compile protocol network public contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/protocol-network-compile --parallel 2             2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/compile.log"

      - name: Run semantic decode and mapper ABI contract
        shell: bash
        run: |
          set -euxo pipefail
          ./build/protocol-network-compile/protocol_semantic_mapper_contract             2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/semantic-mapper.log"

      - name: Assemble focused protocol intake runtime
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/ci/task4_runtime_assembly.py --protocol-intake
          git diff -- CMakeLists.txt turbo_flow/CMakeLists.txt             | tee "$RUNNER_TEMP/protocol-intake-evidence/runtime-assembly.patch"

      - name: Configure focused protocol intake runtime
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/protocol-network-runtime -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DENABLE_SANITIZER_ADDRESS=ON             -DENABLE_SANITIZER_UNDEFINED=ON             -DBUILD_TESTING=ON             -DBUILD_TESTS=ON             -DBUILD_EXAMPLES=OFF             -DBUILD_BENCHMARKS=OFF             -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=OFF             -DTURBO_FLOW_BUILD_RULESFORGE_PLUGIN=OFF             -DTURBO_FLOW_BUILD_APPLICANT_MAPPER_PLUGIN=ON             -DTURBO_FLOW_IDLC_HOST_EXECUTABLE="$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching             2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/runtime-configure.log"

      - name: Build and run focused protocol intake runtime
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/protocol-network-runtime --target test_protocol_network_intake_config test_protocol_network_intake_core test_flow_applicant_mapper_plugin test_cnet_listener_source test_cnet_stream_sink test_turbo_flow_focus test_flow_transport_reply -j2 2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/runtime-build.log"
          ctest --test-dir build/protocol-network-runtime -R '^(test_protocol_network_intake_(config|core)|test_flow_applicant_mapper_plugin|test_cnet_(listener_source|stream_sink)|test_turbo_flow_(transport_vectors|use_aliases|legacy_cflow_boundary|source_only_cflow)|test_flow_transport_reply)$' --output-on-failure 2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/runtime-ctest.log"

      - name: Verify sanitizer instrumentation flags
        shell: bash
        run: |
          set -euxo pipefail
          ninja -C build/protocol-network-compile -t commands > "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F -- '-fsanitize=address' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F -- '-fsanitize=undefined' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F 'flow_protocol_network_intake.c' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F 'test_protocol_network_jtt808.c' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F 'test_protocol_network_coap.c' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"

      - name: Restore focused runtime assembly
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git restore --source=HEAD -- CMakeLists.txt turbo_flow/CMakeLists.txt

      - name: Verify committed source was not modified
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-network-intake-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/protocol-intake-evidence/
            build/protocol-network-compile/CMakeCache.txt
            build/protocol-network-runtime/CMakeCache.txt
