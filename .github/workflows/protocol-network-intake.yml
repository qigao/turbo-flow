name: Protocol network intake

on:
  push:
    branches: [master]
    paths:
      - 'ingress/protocol/**'
      - 'io/cnet/**'
      - 'turbo_flow/**'
      - '.github/ci/protocol-network-compile/**'
      - '.github/workflows/protocol-network-intake.yml'
  pull_request:
    branches: [master, feat/118-real-protocol-intake]
    paths:
      - 'ingress/protocol/**'
      - 'io/cnet/**'
      - 'turbo_flow/**'
      - '.github/ci/protocol-network-compile/**'
      - '.github/workflows/protocol-network-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-network-intake-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VCPKG_COMMIT: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  SALTS_COMMIT: 2804c2eb809fed4cb89f917f0a8cd00f482abb64
  SALTS_UTILS_COMMIT: 0b3876018e5bdaed70fecbc0d0863cb394dd6044
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  linux-public-compile:
    name: Linux public dependency compile contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact TurboFlow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/protocol-intake-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/protocol-intake-evidence/head.txt"
          git diff --check HEAD^ HEAD
          git diff --exit-code

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_COMMIT }}
          path: .ci/deps/salts
          persist-credentials: false

      - name: Checkout pinned SaltsUtils
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_COMMIT }}
          path: .ci/deps/salts-utils
          persist-credentials: false

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public dependency revisions
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C .ci/deps/salts rev-parse HEAD)" = "$SALTS_COMMIT"
          test "$(git -C .ci/deps/salts-utils rev-parse HEAD)" = "$SALTS_UTILS_COMMIT"
          test "$(git -C vcpkg rev-parse HEAD)" = "$VCPKG_COMMIT"
          {
            printf 'salts %s\n' "$SALTS_COMMIT"
            printf 'salts-utils %s\n' "$SALTS_UTILS_COMMIT"
            printf 'vcpkg %s\n' "$VCPKG_COMMIT"
          } | tee "$RUNNER_TEMP/protocol-intake-evidence/dependencies.txt"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: turbo-flow-protocol-intake-public-${{ env.VCPKG_COMMIT }}-v1

      - name: Prepare Linux toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils autoconf automake libtool
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Install pinned re2c 4.6 with Unicode tables
        shell: bash
        run: bash .ci/deps/salts-utils/cmake/ci/install-re2c.sh

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S .ci/deps/salts-utils/tools/lemon -B "$RUNNER_TEMP/host-lemon" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/host-lemon" --target lemon -j2
          test -x "$RUNNER_TEMP/host-lemon/lemon"

      - name: Build and install pinned Salts SDK
        shell: bash
        working-directory: .ci/deps/salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build build/linux-gcc-debug --target install -j2
          test -d "$PROJECT_ROOT/external/pkgs/salts/debug"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$PROJECT_ROOT/external/pkgs/salts/debug" /opt/salts/debug

      - name: Build and install pinned SaltsUtils SDK
        shell: bash
        working-directory: .ci/deps/salts-utils
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$RUNNER_TEMP/host-lemon/lemon" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk/salts-utils-debug"
          cmake --build build/linux-gcc-debug --target install -j2
          test -d "$RUNNER_TEMP/sdk/salts-utils-debug/include"
          sudo mkdir -p /opt/salts-utils
          sudo ln -sfn "$RUNNER_TEMP/sdk/salts-utils-debug" /opt/salts-utils/debug

      - name: Configure public compile contract
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
        run: |
          set -euxo pipefail
          cmake -S .github/ci/protocol-network-compile \
            -B build/protocol-network-compile -G Ninja \
            -DTURBO_FLOW_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DSALTS_SOURCE_DIR="$GITHUB_WORKSPACE/.ci/deps/salts" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed" \
            2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/configure.log"

      - name: Compile all changed protocol-network and CNet translation units
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
        run: |
          set -euxo pipefail
          cmake --build build/protocol-network-compile --parallel 2 \
            2>&1 | tee "$RUNNER_TEMP/protocol-intake-evidence/compile.log"

      - name: Verify sanitizer instrumentation flags
        shell: bash
        run: |
          set -euxo pipefail
          ninja -C build/protocol-network-compile -t commands > "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F -- '-fsanitize=address' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F -- '-fsanitize=undefined' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F 'flow_protocol_network_intake.c' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F 'test_protocol_network_jtt808.c' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"
          grep -F 'test_protocol_network_coap.c' "$RUNNER_TEMP/protocol-intake-evidence/commands.txt"

      - name: Verify committed source was not modified
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code

      - name: Upload exact-head compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-network-intake-public-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/protocol-intake-evidence/
            build/protocol-network-compile/CMakeCache.txt
