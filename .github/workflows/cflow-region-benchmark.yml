name: CFlow region benchmark evidence

on:
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'CMakeOptions.cmake'
      - 'cmake/**'
      - 'turbo_flow/CMakeLists.txt'
      - 'turbo_flow/benchmarks/**'
      - '.github/workflows/cflow-region-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cflow-region-benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release:
    name: Release native vs CFlow region evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact TurboFlow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code

      - name: Use empty vcpkg L1 cache
        shell: bash
        run: |
          set -euxo pipefail
          cache="$RUNNER_TEMP/cflow-region-benchmark-empty-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore latest published native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Verify published dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"
          test -z "${DATABIND_ROOT:-}"
          test -z "${DATABIND_HOST_ROOT:-}"

      - name: Configure Release benchmark
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/cflow-region-benchmark -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=ON \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_SANITIZER_THREAD=OFF \
            -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=OFF \
            -DTURBO_FLOW_BUILD_RULESFORGE_PLUGIN=OFF \
            -DTURBO_FLOW_BUILD_APPLICANT_MAPPER_PLUGIN=OFF \
            -DTURBO_FLOW_IDLC_HOST_EXECUTABLE="$SALTS_UTILS_HOST_ROOT/bin/salts-idlc" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching

      - name: Build benchmark target
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/cflow-region-benchmark --target bench_turbo_flow -j2

      - name: Run fixed CFlow region benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/cflow-region-benchmark-evidence"
          bench="$(find build/cflow-region-benchmark -type f -name bench_turbo_flow -perm -111 | head -n1)"
          test -n "$bench"
          cmake -E env \
            "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/cflow-region-benchmark/bin:$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:${LD_LIBRARY_PATH:-}" \
            "$bench" 2>&1 | tee "$RUNNER_TEMP/cflow-region-benchmark-evidence/full.log"
          grep -E '^BENCH_RESULT stage_plan=typed-identity-2-stage-(native|cflow-region) ' \
            "$RUNNER_TEMP/cflow-region-benchmark-evidence/full.log" \
            | tee "$RUNNER_TEMP/cflow-region-benchmark-evidence/cflow-region.txt"
          test "$(wc -l < "$RUNNER_TEMP/cflow-region-benchmark-evidence/cflow-region.txt")" -eq 2
          grep -F 'stage_plan=typed-identity-2-stage-native ' \
            "$RUNNER_TEMP/cflow-region-benchmark-evidence/cflow-region.txt"
          grep -F 'stage_plan=typed-identity-2-stage-cflow-region ' \
            "$RUNNER_TEMP/cflow-region-benchmark-evidence/cflow-region.txt"
          {
            echo '### CFlow region benchmark'
            echo
            cat "$RUNNER_TEMP/cflow-region-benchmark-evidence/cflow-region.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact head remained clean
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-region-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/cflow-region-benchmark-evidence/
            build/cflow-region-benchmark/CMakeCache.txt
