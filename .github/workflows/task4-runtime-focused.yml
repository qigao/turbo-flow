name: Durable buffer focused validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'turbo_flow/**'
      - 'io/durable/**'
      - 'io/turbodb/**'
      - 'io/chttp/**'
      - 'ingress/protocol/inbox/**'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/workflows/task4-runtime-focused.yml'
  # Staging-only trigger. Remove before promoting #251 to a PR.
  push:
    branches: [feat/251-chttp-typed-contracts]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'turbo_flow/**'
      - 'io/durable/**'
      - 'io/turbodb/**'
      - 'io/chttp/**'
      - 'tests/install_chttp_plugin_consumer/**'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/workflows/task4-runtime-focused.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: task4-durable-buffer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  TSAN_OPTIONS: halt_on_error=1:history_size=7

jobs:
  focused-runtime:
    name: Published TurboDB/CHTTP SDK + provider Graph contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact TurboFlow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/task4-runtime-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/task4-runtime-evidence/head.txt"

      - name: Export exact Task 4 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: task4-source-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            turbo_flow/include/
            turbo_flow/src/
            turbo_flow/tests/
            io/durable/
            io/turbodb/
            io/chttp/

      - name: Use empty vcpkg L1 cache
        shell: bash
        run: |
          set -euxo pipefail
          cache="$RUNNER_TEMP/task4-empty-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore latest published native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64 -WithTurboDB -WithCHttp

      - name: Verify published dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"
          test -f "$TURBODB_ROOT/lib/cmake/TurboDB/TurboDBConfig.cmake"
          test -z "${DATABIND_ROOT:-}"
          test -z "${DATABIND_HOST_ROOT:-}"

      - name: Apply focused Task 4 validation-only CMake assembly
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/ci/task4_runtime_assembly.py --turbodb --chttp
          git diff -- CMakeLists.txt turbo_flow/CMakeLists.txt ingress/protocol/inbox/CMakeLists.txt             | tee "$RUNNER_TEMP/task4-runtime-evidence/focused-cmake.patch"

      - name: Configure focused exact-source Graph build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/task4-runtime -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_SANITIZER_ADDRESS=ON             -DENABLE_SANITIZER_UNDEFINED=ON             -DBUILD_TESTING=ON             -DBUILD_TESTS=ON             -DBUILD_EXAMPLES=OFF             -DBUILD_BENCHMARKS=OFF             -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=ON             -DTURBO_FLOW_IDLC_HOST_EXECUTABLE="$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching             2>&1 | tee "$RUNNER_TEMP/task4-runtime-evidence/configure.log"

      - name: Build durable Graph tests and TurboDB adapter
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/task4-runtime             --target tf_turbodb_adapter tf_turbodb_plugin                      test_turbodb_typed_config test_turbodb_durable_buffer_plugin test_turbodb_inbox test_turbodb_inbox_source                      tf_chttp_plugin test_chttp_typed_contract test_chttp_provider_interface                      test_flow_durable_buffer test_flow_durable_admission                      test_flow_durable_lifecycle                      test_flow_plugin_generation test_flow_provider_interface test_flow_provider_adapter_binding test_flow_salts_provider_binding test_flow_provider_binding test_flow_resource_binding                      test_flow_compiled_provider_instance test_flow_provider_generation test_flow_durable_identity                      test_flow_inbox test_flow_inbox_source test_flow_inbox_driver                      test_flow_async_terminal test_flow_run test_flow_operation_result                      test_flow_projection_owner test_flow_projection_owner_fault             -j2 2>&1 | tee "$RUNNER_TEMP/task4-runtime-evidence/build.log"

      - name: Run provider-neutral durable Graph tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/task4-runtime             -R '^(test_flow_(durable_buffer|durable_admission|durable_lifecycle|plugin_generation|provider_interface|provider_adapter_binding|salts_provider_binding|provider_binding|resource_binding|compiled_provider_instance|provider_generation|durable_identity|inbox|inbox_source|inbox_driver|async_terminal|run|operation_result|projection_owner|projection_owner_fault)|test_turbodb_(typed_config|durable_buffer_plugin|inbox|inbox_source)|test_chttp_(typed_contract|provider_interface))$'             --output-on-failure 2>&1 | tee "$RUNNER_TEMP/task4-runtime-evidence/ctest.log"

      - name: Verify TurboDB adapter does not absorb native database drivers
        shell: bash
        run: |
          set -euxo pipefail
          adapter="$(find build/task4-runtime -type f -name 'libtf_turbodb_adapter.so*' | head -n1)"
          test -n "$adapter"
          if command -v readelf >/dev/null; then
            ! readelf -d "$adapter" | grep -Ei 'sqlite|tidesdb|pq|mysql|mongo'
          fi
          printf '%s\n' "$adapter" > "$RUNNER_TEMP/task4-runtime-evidence/turbodb-adapter.txt"

      - name: Verify CHTTP provider exports only the Salts Plugin entry
        shell: bash
        run: |
          set -euxo pipefail
          plugin="$(find build/task4-runtime -type f -name 'libtf_chttp_plugin.so*' | head -n1)"
          test -n "$plugin"
          exports="$(nm -D --defined-only "$plugin" | awk '$2 ~ /^[TW]$/ {print $3}' | sort -u)"
          printf '%s\n' "$exports" | tee "$RUNNER_TEMP/task4-runtime-evidence/chttp-provider-exports.txt"
          test "$exports" = "salts_plugin_query"
          ! nm -D --defined-only "$plugin" | grep -F 'turbo_flow_plugin_get_api'
          printf '%s\n' "$plugin" > "$RUNNER_TEMP/task4-runtime-evidence/chttp-provider.txt"

      - name: Configure Release ThreadSanitizer concurrency build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/task4-runtime-tsan -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF             -DENABLE_SANITIZER_THREAD=ON             -DBUILD_TESTING=ON             -DBUILD_TESTS=ON             -DBUILD_EXAMPLES=OFF             -DBUILD_BENCHMARKS=OFF             -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=ON             -DTURBO_FLOW_IDLC_HOST_EXECUTABLE="$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching             2>&1 | tee "$RUNNER_TEMP/task4-runtime-evidence/configure-tsan.log"

      - name: Build and run Release ThreadSanitizer concurrency tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/task4-runtime-tsan             --target test_flow_durable_lifecycle test_flow_inbox test_flow_inbox_driver test_flow_async_terminal             -j2 2>&1 | tee "$RUNNER_TEMP/task4-runtime-evidence/build-tsan.log"
          ctest --test-dir build/task4-runtime-tsan             -R '^test_flow_(durable_lifecycle|inbox|inbox_driver|async_terminal)$'             --output-on-failure 2>&1 | tee "$RUNNER_TEMP/task4-runtime-evidence/ctest-tsan.log"

      - name: Verify committed source remained untouched
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git diff --name-only | grep -Ev '^(CMakeLists\.txt|turbo_flow/CMakeLists\.txt|ingress/protocol/inbox/CMakeLists\.txt)$' || true)"
          git diff --exit-code -- turbo_flow/include turbo_flow/src turbo_flow/tests io/durable io/turbodb io/chttp

      - name: Upload Task 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task4-durable-buffer-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/task4-runtime-evidence/
            build/task4-runtime/CMakeCache.txt
            build/task4-runtime-tsan/CMakeCache.txt
