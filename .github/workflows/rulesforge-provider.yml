name: RulesForge provider validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'CMakeOptions.cmake'
      - 'cmake/**'
      - 'turbo_flow/**'
      - 'io/cnet/**'
      - 'io/durable/**'
      - 'ingress/protocol/**'
      - 'plugins/rulesforge/**'
      - 'plugins/applicant_mapper/**'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/workflows/rulesforge-provider.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rulesforge-provider-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  provider:
    name: Published RulesForge ABI3 provider
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact TurboFlow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          git diff --exit-code

      - name: Restore shared binary and compiler caches
        uses: ./.github/actions/setup-native-ci
        with:
          profile: rulesforge-provider-linux-asan

      - name: Restore latest published ecosystem SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64 -WithRulesForge

      - name: Verify published dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/include/data_bind_native.h"
          test -x "$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"
          test -f "$RULES_FORGE_ROOT/lib/cmake/RulesForge/RulesForgeConfig.cmake"
          test ! -e "$SALTS_UTILS_ROOT/lib/cmake/DataBind/DataBindConfig.cmake"
          test -z "${DATABIND_ROOT:-}"
          test -z "${DATABIND_HOST_ROOT:-}"

      - name: Apply RulesForge provider validation-only CMake assembly
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/ci/task4_runtime_assembly.py --rulesforge
          git diff -- CMakeLists.txt turbo_flow/CMakeLists.txt | tee "$RUNNER_TEMP/rulesforge-focused-cmake.patch"

      - name: Configure provider-focused TurboFlow build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/rulesforge-provider -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DENABLE_SANITIZER_ADDRESS=ON             -DENABLE_SANITIZER_UNDEFINED=ON             -DBUILD_TESTING=ON             -DBUILD_TESTS=ON             -DBUILD_EXAMPLES=OFF             -DBUILD_BENCHMARKS=OFF             -DTURBO_FLOW_BUILD_RULESFORGE_PLUGIN=ON             -DTURBO_FLOW_BUILD_APPLICANT_MAPPER_PLUGIN=ON             -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=OFF             -DTURBO_FLOW_IDLC_HOST_EXECUTABLE="$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching

      - name: Build and run RulesForge provider contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/rulesforge-provider --target test_flow_rulesforge_plugin -j2
          ctest --test-dir build/rulesforge-provider -R '^test_flow_rulesforge_plugin$' --output-on-failure

      - name: Install and load RulesForge provider from install tree
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$RUNNER_TEMP/turboflow-rulesforge-install"
          cmake --install build/rulesforge-provider --prefix "$prefix"
          provider="$(find "$prefix" -type f \( -name 'libtf_rulesforge_provider.so' -o -name 'tf_rulesforge_provider.dll' \) | head -n1)"
          test_bin="$(find build/rulesforge-provider -type f -name 'test_flow_rulesforge_plugin*' -perm -111 | head -n1)"
          test -n "$provider"
          test -n "$test_bin"
          LD_LIBRARY_PATH="$prefix/lib:$LD_LIBRARY_PATH" \
            FLOW_RULESFORGE_PLUGIN_PATH="$provider" \
            "$test_bin"

      - name: Verify core unlink and canonical provider export
        shell: bash
        run: |
          set -euxo pipefail
          graph="$(find build/rulesforge-provider -type f \( -name 'libturbo_flow_graph.so.*' -o -name 'turbo_flow_graph.dll' \) | head -n1)"
          provider="$(find build/rulesforge-provider -type f \( -name 'libtf_rulesforge_provider.so' -o -name 'tf_rulesforge_provider.dll' \) | head -n1)"
          test -n "$graph"
          test -n "$provider"
          if command -v readelf >/dev/null; then
            ! readelf -d "$graph" | grep -F RulesForge
          fi
          nm -D --defined-only "$provider" | awk '{print $3}' | grep -v '^$' | sort -u > "$RUNNER_TEMP/provider-exports.txt"
          test "$(cat "$RUNNER_TEMP/provider-exports.txt")" = "turbo_flow_plugin_get_api"

      - name: Restore validation-only CMake assembly
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git restore --source=HEAD -- CMakeLists.txt turbo_flow/CMakeLists.txt

      - name: Verify committed source remained clean
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats >> "$GITHUB_STEP_SUMMARY"
          fi
