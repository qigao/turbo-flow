name: Task 4 staging patch

on:
  push:
    branches: [work/task4-durable-admission-green]
    paths:
      - '.github/workflows/task4-staging-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/task4-durable-admission-green
          fetch-depth: 0

      - name: Apply exact Task 4 wiring
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s' '' | base64 -d > /tmp/task4_patch.py
          python3 /tmp/task4_patch.py
          git diff --check
          git diff --stat

      - name: Commit staging patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turbo_flow/src/flow_internal.h turbo_flow/src/flow_core.c \
                  turbo_flow/src/flow_compile.c turbo_flow/src/flow_runtime.c \
                  turbo_flow/tests/test_flow_durable_buffer.c
          git commit -m "feat(graph): wire durable buffer admission boundary"
          git push origin HEAD:work/task4-durable-admission-green
