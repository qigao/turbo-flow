  it("rejects one binding shared by multiple durable buffer stages") {
    static const char graph[] =
        "buffer first resource intake.store\n"
        "buffer second resource intake.store\n"
        "source telemetry\n"
        "stage normalize adapter sink\n"
        "stage main {\n"
        "  telemetry -> first\n"
        "  first -> second\n"
        "  second -> normalize\n"
        "}\n";
    turbo_flow_adapter_ops_t ops;
    turbo_flow_inbox_t inbox = TURBO_FLOW_INBOX_INIT;
    turbo_flow_t *flow = durable_buffer_parse(graph);
    turbo_flow_durable_buffer_binding_t *binding;
    size_t sink_calls = 0u;

