              p.write_text(text.replace(old, new, 1))

          replace(
              "turbo_flow/src/flow_internal.h",
              "  vec_t stages;\n  vec_t edges;\n  flow_compiled_plan_t compiled_plan;",
              "  vec_t stages;\n  vec_t edges;\n  struct turbo_flow_durable_buffer_binding_s *durable_buffer_bindings;\n"
              "  flow_compiled_plan_t compiled_plan;",
          )
          replace(
              "turbo_flow/src/flow_internal.h",
              "void flow_clear_plan(turbo_flow_t *flow);\n"
              "void flow_clear_registry(turbo_flow_t *flow);\n"
              "int flow_build_runtime_plan(turbo_flow_t *flow);",
              "void flow_clear_plan(turbo_flow_t *flow);\n"
              "void flow_clear_registry(turbo_flow_t *flow);\n"
              "void flow_durable_buffer_clear_bindings(turbo_flow_t *flow);\n"
              "int flow_durable_buffer_resolve_bindings(turbo_flow_t *flow);\n"
              "int flow_durable_buffer_admit_stage(turbo_flow_t *flow, uint32_t stage_index,\n"
              "                                    const turbo_flow_msg_t *message);\n"
              "int flow_build_runtime_plan(turbo_flow_t *flow);",
          )
          replace(
              "turbo_flow/src/flow_core.c",
              "void flow_clear_registry(turbo_flow_t *flow) {\n  size_t i;\n\n  if (!flow) return;\n",
              "void flow_clear_registry(turbo_flow_t *flow) {\n  size_t i;\n\n  if (!flow) return;\n"
              "  flow_durable_buffer_clear_bindings(flow);\n",
          )
          replace(
              "turbo_flow/src/flow_compile.c",
              "  rc = compile_validate_fanout_mutability(flow);\n"
              "  if (rc != SALTS_OK) return rc;\n"
              "  rc = flow_build_runtime_plan(flow);",
              "  rc = compile_validate_fanout_mutability(flow);\n"
              "  if (rc != SALTS_OK) return rc;\n"
              "  rc = flow_durable_buffer_resolve_bindings(flow);\n"
              "  if (rc != SALTS_OK) return rc;\n"
              "  rc = flow_build_runtime_plan(flow);",
          )
          replace(
              "turbo_flow/src/flow_runtime.c",
              "    if (stage->is_buffer) {\n"
              "      done[stage_index] = 1u;\n"
              "      continue;\n"
              "    }",
              "    if (stage->is_buffer) {\n"
              "      rc = flow_durable_buffer_admit_stage(flow, stage_index, message);\n"
              "      done[stage_index] = 1u;\n"
              "      if (rc != SALTS_OK) goto cleanup;\n"
              "      continue;\n"
              "    }",
          )

          test_path = Path("turbo_flow/tests/test_flow_durable_buffer.c")
          text = test_path.read_text()
          anchor = "static turbo_flow_t *durable_buffer_compile_graph(size_t *sink_calls) {"
          assert text.count(anchor) == 1
          helper_anchor = "  return flow;\n}\n\nspec(\"Graph durable buffer DSL\") {"
          assert text.count(helper_anchor) == 1
          helpers = r'''  return flow;
}

static turbo_flow_durable_buffer_binding_t *durable_buffer_bind_memory(
    turbo_flow_t *flow, turbo_flow_inbox_t *inbox) {
  turbo_flow_inbox_memory_config_t inbox_config = turbo_flow_inbox_memory_config_default();
  turbo_flow_durable_buffer_binding_config_t binding_config =
      TURBO_FLOW_DURABLE_BUFFER_BINDING_CONFIG_INIT;
  turbo_flow_durable_buffer_binding_t *binding = NULL;

  *inbox = (turbo_flow_inbox_t)TURBO_FLOW_INBOX_INIT;
  check_equal(turbo_flow_inbox_memory_create(&inbox_config, inbox), SALTS_OK);
  binding_config.resource_name = "intake.store";
  binding_config.inbox = inbox;
  check_equal(turbo_flow_durable_buffer_bind(flow, &binding_config, &binding), SALTS_OK);
  check_not_null(binding);
  return binding;
}

static void durable_buffer_release_memory(turbo_flow_durable_buffer_binding_t *binding,
                                          turbo_flow_inbox_t *inbox) {
  check_equal(turbo_flow_durable_buffer_unbind(binding), SALTS_OK);
  check_equal(turbo_flow_inbox_close(inbox), SALTS_OK);
  check_equal(turbo_flow_inbox_destroy(inbox), SALTS_OK);
}

