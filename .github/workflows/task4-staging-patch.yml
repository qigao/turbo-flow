name: Task 4 staging patch

on:
  push:
    branches: [work/task4-durable-admission-green]
    paths:
      - '.github/workflows/task4-staging-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/task4-durable-admission-green
          fetch-depth: 0

      - name: Apply exact Task 4 wiring
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
