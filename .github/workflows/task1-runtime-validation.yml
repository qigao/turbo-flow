name: Task 1 runtime validation

on:
  push:
    branches: [ci/127-task1-runtime-validation]
    paths:
      - '.github/workflows/task1-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: e225b04730075ebd2a414d8bd2d830557fcab961
  VCPKG_COMMIT: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  SALTS_COMMIT: 2804c2eb809fed4cb89f917f0a8cd00f482abb64
  SALTS_UTILS_COMMIT: 0b3876018e5bdaed70fecbc0d0863cb394dd6044
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  focused-runtime:
    name: Focused Graph Task 1 runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact production head under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact production source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/task1-runtime-evidence"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          git -C target diff --check HEAD^ HEAD
          git -C target rev-parse HEAD | tee "$RUNNER_TEMP/task1-runtime-evidence/head.txt"

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_COMMIT }}
          path: .ci/deps/salts
          persist-credentials: false

      - name: Checkout pinned SaltsUtils
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_COMMIT }}
          path: .ci/deps/salts-utils
          persist-credentials: false

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Linux toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils autoconf automake libtool
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Install pinned re2c 4.6 with Unicode tables
        shell: bash
        run: bash .ci/deps/salts-utils/cmake/ci/install-re2c.sh

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S .ci/deps/salts-utils/tools/lemon -B "$RUNNER_TEMP/host-lemon" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/host-lemon" --target lemon -j2
          test -x "$RUNNER_TEMP/host-lemon/lemon"

      - name: Build and install pinned Salts SDK
        shell: bash
        working-directory: .ci/deps/salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build build/linux-gcc-debug --target install -j2
          test -d "$PROJECT_ROOT/external/pkgs/salts/debug"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$PROJECT_ROOT/external/pkgs/salts/debug" /opt/salts/debug

      - name: Build and install pinned SaltsUtils SDK
        shell: bash
        working-directory: .ci/deps/salts-utils
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$RUNNER_TEMP/host-lemon/lemon" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk/salts-utils-debug"
          cmake --build build/linux-gcc-debug --target install -j2
          test -d "$RUNNER_TEMP/sdk/salts-utils-debug/include"
          sudo mkdir -p /opt/salts-utils
          sudo ln -sfn "$RUNNER_TEMP/sdk/salts-utils-debug" /opt/salts-utils/debug

      - name: Apply focused validation-only CMake assembly
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('target/CMakeLists.txt')
          text = root.read_text()
          old = "set(_turbo_flow_required_dependency_roots\n    SALTS_ROOT SALTS_UTILS_ROOT RULES_FORGE_ROOT)"
          new = "set(_turbo_flow_required_dependency_roots\n    SALTS_ROOT SALTS_UTILS_ROOT)"
          assert old in text
          text = text.replace(old, new, 1)
          assert "include(TurboFlowRequireCHTTP)" in text
          text = text.replace("include(TurboFlowRequireCHTTP)\n", "", 1)
          start = text.index("add_subdirectory(turbo_flow)\n")
          end = text.index("set(TURBO_FLOW_EXPORT_TARGETS)", start)
          text = text[:start] + "add_subdirectory(turbo_flow)\n\n" + text[end:]
          root.write_text(text)

          graph = Path('target/turbo_flow/CMakeLists.txt')
          text = graph.read_text()
          rules = "find_package(RulesForge 0.9 CONFIG REQUIRED\n             PATHS \"$ENV{RULES_FORGE_ROOT}\" NO_DEFAULT_PATH)\n"
          assert rules in text
          text = text.replace(rules, "", 1)
          marker = "file(GLOB TURBO_FLOW_SOURCES CONFIGURE_DEPENDS ${CMAKE_CURRENT_SOURCE_DIR}/src/*.c)\n"
          assert marker in text
          text = text.replace(marker, marker + "list(REMOVE_ITEM TURBO_FLOW_SOURCES ${CMAKE_CURRENT_SOURCE_DIR}/src/flow_rulesforge.c)\n", 1)
          assert "Salts::CMeta RulesForge::RulesForge" in text
          text = text.replace("Salts::CMeta RulesForge::RulesForge", "Salts::CMeta", 1)
          insertion = '''\ncmake_add_test(\n  test_flow_durable_buffer\n  SOURCES ${CMAKE_CURRENT_SOURCE_DIR}/tests/test_flow_durable_buffer.c\n  LIBS TurboFlow::Graph Salts::TinyTest\n  FOLDER \"turbo_flow/tests\")\n\ncmake_add_test(\n  test_turbo_flow\n  SOURCES ${CMAKE_CURRENT_SOURCE_DIR}/tests/test_turbo_flow.c\n          ${CMAKE_CURRENT_SOURCE_DIR}/tests/flow_plan_type_probe.c\n  LIBS TurboFlow::Graph Salts::CFlow Salts::TinyTest\n  INCLUDES ${CMAKE_CURRENT_SOURCE_DIR}/src\n  FOLDER \"turbo_flow/tests\")\n\nreturn()\n\n'''
          anchor = "add_library(turbo_flow_product SHARED\n"
          assert anchor in text
          text = text.replace(anchor, insertion + anchor, 1)
          graph.write_text(text)
          PY
          git -C target diff -- CMakeLists.txt turbo_flow/CMakeLists.txt \
            | tee "$RUNNER_TEMP/task1-runtime-evidence/focused-cmake.patch"

      - name: Configure focused exact-source Graph build
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
        run: |
          set -euxo pipefail
          cmake -S target -B build/task1-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=OFF \
            -DTURBO_FLOW_TBE_COMPILER_HOST_EXECUTABLE="$RUNNER_TEMP/sdk/salts-utils-debug/bin/tbe_compiler" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/target" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed" \
            2>&1 | tee "$RUNNER_TEMP/task1-runtime-evidence/configure.log"

      - name: Build exact Task 1 test binaries
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/task1-runtime --target test_flow_durable_buffer test_turbo_flow -j2 \
            2>&1 | tee "$RUNNER_TEMP/task1-runtime-evidence/build.log"

      - name: Run durable-buffer parser contract
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/task1-runtime -R '^test_flow_durable_buffer$' --output-on-failure \
            2>&1 | tee "$RUNNER_TEMP/task1-runtime-evidence/test_flow_durable_buffer.log"

      - name: Run core Graph regression
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/task1-runtime -R '^test_turbo_flow$' --output-on-failure \
            2>&1 | tee "$RUNNER_TEMP/task1-runtime-evidence/test_turbo_flow.log"

      - name: Verify exact C/parser/test source remained untouched
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          git -C target diff --exit-code -- \
            turbo_flow/src turbo_flow/include turbo_flow/parser \
            turbo_flow/tests/test_flow_durable_buffer.c \
            turbo_flow/tests/test_turbo_flow.c \
            turbo_flow/tests/flow_plan_type_probe.c

      - name: Upload focused runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-runtime-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/task1-runtime-evidence/
            build/task1-runtime/CMakeCache.txt
