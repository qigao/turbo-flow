name: Task 3 focused runtime validation

on:
  push:
    branches: [feat/127-graph-durable-buffer]
    paths:
      - '.github/workflows/task3-runtime-focused.yml'
      - '.github/ci/task3_runtime_assembly.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: a16a06c96509078bdc44415615d21086dbe97ebc
  VCPKG_COMMIT: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  SALTS_COMMIT: 2804c2eb809fed4cb89f917f0a8cd00f482abb64
  SALTS_UTILS_COMMIT: 0b3876018e5bdaed70fecbc0d0863cb394dd6044
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  focused-runtime:
    name: Focused Graph Task 3 runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout exact production head under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact production source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/task3-runtime-evidence"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          git -C target diff --check HEAD^ HEAD
          git -C target rev-parse HEAD | tee "$RUNNER_TEMP/task3-runtime-evidence/head.txt"

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_COMMIT }}
          path: .ci/deps/salts
          persist-credentials: false

      - name: Checkout pinned SaltsUtils
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_COMMIT }}
          path: .ci/deps/salts-utils
          persist-credentials: false

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Linux toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils autoconf automake libtool
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Install pinned re2c 4.6 with Unicode tables
        shell: bash
        run: bash .ci/deps/salts-utils/cmake/ci/install-re2c.sh

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S .ci/deps/salts-utils/tools/lemon -B "$RUNNER_TEMP/host-lemon" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/host-lemon" --target lemon -j2
          test -x "$RUNNER_TEMP/host-lemon/lemon"

      - name: Build and install pinned Salts SDK
        shell: bash
        working-directory: .ci/deps/salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/linux-gcc-debug --target install -j2
          test -d "$PROJECT_ROOT/external/pkgs/salts/debug"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$PROJECT_ROOT/external/pkgs/salts/debug" /opt/salts/debug

      - name: Build and install pinned SaltsUtils SDK
        shell: bash
        working-directory: .ci/deps/salts-utils
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$RUNNER_TEMP/host-lemon/lemon" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk/salts-utils-debug"
          cmake --build build/linux-gcc-debug --target install -j2
          test -d "$RUNNER_TEMP/sdk/salts-utils-debug/include"
          sudo mkdir -p /opt/salts-utils
          sudo ln -sfn "$RUNNER_TEMP/sdk/salts-utils-debug" /opt/salts-utils/debug

      - name: Apply focused Task 3 validation-only CMake assembly
        shell: bash
        run: |
          set -euxo pipefail
          python3 harness/.github/ci/task3_runtime_assembly.py
          git -C target diff -- CMakeLists.txt turbo_flow/CMakeLists.txt | tee "$RUNNER_TEMP/task3-runtime-evidence/focused-cmake.patch"

      - name: Configure focused exact-source Graph build
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
        run: |
          set -euxo pipefail
          cmake -S target -B build/task3-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DTURBO_FLOW_BUILD_TURBODB_ADAPTER=OFF \
            -DTURBO_FLOW_TBE_COMPILER_HOST_EXECUTABLE="$RUNNER_TEMP/sdk/salts-utils-debug/bin/tbe_compiler" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/target" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed" \
            2>&1 | tee "$RUNNER_TEMP/task3-runtime-evidence/configure.log"

      - name: Build exact Task 3 test binaries
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/task3-runtime --target test_flow_durable_buffer test_flow_durable_identity test_flow_data_schema test_flow_projection_owner -j2 2>&1 | tee "$RUNNER_TEMP/task3-runtime-evidence/build.log"

      - name: Run Task 3 runtime gates
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/task3-runtime -R '^(test_flow_durable_buffer|test_flow_durable_identity|test_flow_data_schema|test_flow_projection_owner)$' --output-on-failure 2>&1 | tee "$RUNNER_TEMP/task3-runtime-evidence/ctest.log"

      - name: Verify exact Task 3 production/test source remained untouched
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          git -C target diff --exit-code -- \
            turbo_flow/src/flow_message.c \
            turbo_flow/src/flow_projection_owner_internal.h \
            turbo_flow/include/turbo_flow_durable_buffer.h \
            turbo_flow/tests/test_flow_durable_buffer.c \
            turbo_flow/tests/test_flow_durable_identity.c \
            turbo_flow/tests/durable_identity_header_cpp.cpp \
            turbo_flow/tests/test_flow_data_schema.c \
            turbo_flow/tests/test_flow_projection_owner.c \
            turbo_flow/tests/projection_header_cpp.cpp

      - name: Upload focused runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task3-runtime-focused-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/task3-runtime-evidence/
            build/task3-runtime/CMakeCache.txt
