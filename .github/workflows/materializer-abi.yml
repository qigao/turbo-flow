name: Materializer ABI validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'turbo_flow/CMakeLists.txt'
      - 'turbo_flow/include/turbo_flow_plugin*.h'
      - 'turbo_flow/src/flow_plugin.c'
      - 'turbo_flow/src/flow_plugin_generation.c'
      - 'turbo_flow/src/flow_config.c'
      - 'turbo_flow/src/flow_config_operation.c'
      - 'turbo_flow/include/turbo_flow_resolved_config.h'
      - 'turbo_flow/include/turbo_flow_config_limits.h'
      - 'turbo_flow/tests/**'
      - '.github/ci/task4_runtime_assembly.py'
      - '.github/workflows/materializer-abi.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: materializer-abi-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  materializer:
    name: ABI3.1 materializer catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact TurboFlow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          git diff --exit-code

      - name: Restore shared binary and compiler caches
        uses: ./.github/actions/setup-native-ci
        with:
          profile: materializer-abi-linux-asan

      - name: Restore latest published native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Verify published dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/include/data_bind.h"
          test -x "$SALTS_UTILS_HOST_ROOT/bin/salts-idlc"
          test -z "${DATABIND_ROOT:-}"
          test -z "${DATABIND_HOST_ROOT:-}"

      - name: Apply materializer validation-only CMake assembly
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/ci/task4_runtime_assembly.py --materializer
          git diff -- CMakeLists.txt turbo_flow/CMakeLists.txt | tee "$RUNNER_TEMP/materializer-focused-cmake.patch"

      - name: Configure focused materializer build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/materializer-abi -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DENABLE_SANITIZER_ADDRESS=ON             -DENABLE_SANITIZER_UNDEFINED=ON             -DBUILD_TESTING=ON             -DBUILD_TESTS=ON             -DBUILD_EXAMPLES=OFF             -DBUILD_BENCHMARKS=OFF             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching

      - name: Build and run materializer ABI tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/materializer-abi \
            --target test_flow_plugin_materializer test_materializer_binding_config \
                     test_flow_plugin_materializer_generation test_flow_plugin_operation_runtime \
                     test_flow_reflected_operation \
            -j2
          ctest --test-dir build/materializer-abi \
            -R '^(test_flow_plugin_materializer|test_materializer_binding_config|test_flow_plugin_materializer_generation|test_flow_plugin_operation_runtime|test_flow_reflected_operation)$' \
            --output-on-failure

      - name: Restore validation-only CMake assembly
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git restore --source=HEAD -- CMakeLists.txt turbo_flow/CMakeLists.txt

      - name: Verify committed source remained clean
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats >> "$GITHUB_STEP_SUMMARY"
          fi
