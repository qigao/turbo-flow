version: 1

profiles:
  orders:
    enqueue: queue.orders.sink
    dequeue: queue.orders.source

channels:
  orders:
    kind: queue
    config:
      backend: memory
      pattern: push_pull
      resource_uid: queue:orders
      owner_name: orders-queue
      capacity: 1024
      max_active_claims: 64
      max_payload_size: 1048576
      full_policy: fail

  durable-events:
    kind: queue
    config:
      backend: sqlite
      pattern: push_pull
      resource_uid: queue:durable-events
      owner_name: durable-events-queue
      capacity: 4096
      max_active_claims: 64
      max_payload_size: 1048576
      max_state_size: 16777216
      full_policy: block
      enqueue_timeout_ms: 5000
      database_path: flow-events.sqlite3
      queue_name: events
      busy_timeout_ms: 1000

adapters:
  queue.orders.sink:
    kind: queue
    config:
      channel: orders
      role: sink

  queue.orders.source:
    kind: queue
    config:
      channel: orders
      role: source

  queue.events.sink:
    kind: queue
    config:
      channel: durable-events
      role: sink

  queue.events.source:
    kind: queue
    config:
      channel: durable-events
      role: source
